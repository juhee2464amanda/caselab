<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시작하기 — 케이스랩</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#fff;--bg-sub:#f7f7f7;--ink:#191f28;--gray-600:#6b7684;--gray-500:#8b95a1;--gray-400:#b0b8c1;--gray-200:#e5e8eb;--gray-100:#f2f4f6;--blue:#3182f6;--blue-bg:#ebf4ff}
    *{margin:0;padding:0;box-sizing:border-box}
    html{font-size:16px;-webkit-font-smoothing:antialiased}
    body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg-sub);color:var(--ink);line-height:1.5;letter-spacing:-0.02em;min-height:100vh;display:flex;flex-direction:column}
    .keepall{word-break:keep-all;overflow-wrap:break-word}
    a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:none;background:none}

    .gnb{background:#fff;border-bottom:1px solid var(--gray-200)}
    .gnb-inner{max-width:1100px;margin:0 auto;padding:0 24px;display:flex;align-items:center;height:56px}
    .gnb-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;font-weight:700;letter-spacing:-0.01em}
    

    .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 24px}
    .card{width:100%;max-width:520px;background:#fff;border-radius:16px;padding:36px 32px 32px;box-shadow:0 2px 12px rgba(0,0,0,.04)}

    h1{font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px}
    .sub{font-size:14px;color:var(--gray-600);margin-bottom:28px}

    .section{margin-bottom:24px}
    .section-label{font-size:13px;font-weight:700;color:var(--gray-500);margin-bottom:10px}

    /* Job: single select row */
    .job-row{display:flex;gap:8px;flex-wrap:wrap}
    .job-btn{flex:1;padding:10px 0;text-align:center;font-size:14px;font-weight:600;color:var(--gray-600);border:1.5px solid var(--gray-200);border-radius:10px;transition:all .12s}
    .job-btn:hover{border-color:var(--gray-400)}
    .job-btn.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}

    /* Interest: multi select chips */
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{padding:7px 14px;font-size:13px;font-weight:500;color:var(--gray-600);border:1.5px solid var(--gray-200);border-radius:20px;transition:all .12s}
    .chip:hover{border-color:var(--gray-400)}
    .chip.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);font-weight:600}

    .footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
    .btn-skip{font-size:14px;color:var(--gray-400)}
    .btn-skip:hover{color:var(--gray-600)}
    .btn-start{padding:12px 28px;font-size:15px;font-weight:700;color:#fff;background:var(--blue);border-radius:10px;letter-spacing:-0.02em;transition:background .15s}
    .btn-start:hover{background:#1b6ef2}
  </style>
</head>
<body>

  <header class="gnb">
    <div class="gnb-inner">
      <a href="index.html" class="gnb-logo">Caselab</a>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <h1>가입 완료! 30초만 알려주세요.</h1>
      <p class="sub keepall">선택하면 홈에서 <strong style="color:var(--blue)">내 직무에 맞는 케이스만 먼저</strong> 보여드려요. 나중에 바꿀 수 있습니다.</p>

      <div class="section">
        <div class="section-label">직업</div>
        <div class="job-row">
          <button class="job-btn" type="button" data-group="job">직장인</button>
          <button class="job-btn" type="button" data-group="job">자영업자</button>
          <button class="job-btn" type="button" data-group="job">프리랜서</button>
          <button class="job-btn" type="button" data-group="job">학생</button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">직무</div>
        <div class="job-row">
          <button class="job-btn" type="button" data-group="role">기획</button>
          <button class="job-btn" type="button" data-group="role">마케팅</button>
          <button class="job-btn" type="button" data-group="role">영업</button>
          <button class="job-btn" type="button" data-group="role">디자인</button>
          <button class="job-btn" type="button" data-group="role">개발</button>
          <button class="job-btn" type="button" data-group="role">기타</button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">관심 주제 (복수 선택)</div>
        <div class="chips">
          <button class="chip" type="button">프롬프트 작성법</button>
          <button class="chip" type="button">보고서·기획서</button>
          <button class="chip" type="button">경쟁사 분석</button>
          <button class="chip" type="button">AI 도구 비교</button>
          <button class="chip" type="button">업무 자동화</button>
          <button class="chip" type="button">회의록 정리</button>
          <button class="chip" type="button">콘텐츠 마케팅</button>
          <button class="chip" type="button">AI 트렌드</button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">쓰고 있는 AI 도구 (복수 선택)</div>
        <div class="chips">
          <button class="chip" type="button">ChatGPT</button>
          <button class="chip" type="button">Claude</button>
          <button class="chip" type="button">Perplexity</button>
          <button class="chip" type="button">Gemini</button>
          <button class="chip" type="button">Notion AI</button>
          <button class="chip" type="button">아직 없음</button>
        </div>
      </div>

      <div class="footer-row">
        <a href="index.html" class="btn-skip">건너뛰기</a>
        <a href="index.html" class="btn-start">시작하기</a>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.job-btn').forEach(function(b){
      b.addEventListener('click',function(){
        var group = this.dataset.group;
        document.querySelectorAll('.job-btn[data-group="'+group+'"]').forEach(function(j){j.classList.remove('on')});
        this.classList.add('on');
      });
    });
    document.querySelectorAll('.chip').forEach(function(c){
      c.addEventListener('click',function(){this.classList.toggle('on')});
    });
  </script>
</body>
</html>

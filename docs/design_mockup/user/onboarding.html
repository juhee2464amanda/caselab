<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시작하기 — 케이스랩</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#fff;--bg-sub:#f7f7f7;--ink:#191f28;--gray-600:#6b7684;--gray-500:#8b95a1;--gray-400:#b0b8c1;--gray-200:#e5e8eb;--gray-100:#f2f4f6;--blue:#3182f6;--blue-bg:#ebf4ff}
    *{margin:0;padding:0;box-sizing:border-box}
    html{font-size:16px;-webkit-font-smoothing:antialiased}
    body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg-sub);color:var(--ink);line-height:1.5;letter-spacing:-0.02em;min-height:100vh;display:flex;flex-direction:column}
    .keepall{word-break:keep-all;overflow-wrap:break-word}
    a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:none;background:none}

    .gnb{background:#fff;border-bottom:1px solid var(--gray-200)}
    .gnb-inner{max-width:1100px;margin:0 auto;padding:0 24px;display:flex;align-items:center;height:56px}
    .gnb-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;font-weight:700;letter-spacing:-0.01em} .gnb-sub-msg{font-size:12px;font-weight:500;color:var(--gray-400);border-left:1px solid var(--gray-200);padding-left:12px;margin-top:8px;display:none;letter-spacing:-0.01em} @media(min-width:960px){.gnb-sub-msg{display:block}}
    

    .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 24px}
    .card{width:100%;max-width:520px;background:#fff;border-radius:16px;padding:36px 32px 32px;box-shadow:0 2px 12px rgba(0,0,0,.04)}

    h1{font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px}
    .sub{font-size:14px;color:var(--gray-600);margin-bottom:28px}

    .section{margin-bottom:24px}
    .section-label{font-size:13px;font-weight:700;color:var(--gray-500);margin-bottom:10px}

    /* Job: single select row */
    .job-row{display:flex;gap:8px;flex-wrap:wrap}
    .job-btn{flex:1;padding:10px 0;text-align:center;font-size:14px;font-weight:600;color:var(--gray-600);border:1.5px solid var(--gray-200);border-radius:10px;transition:all .12s}
    .job-btn:hover{border-color:var(--gray-400)}
    .job-btn.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}

    /* Interest: multi select chips */
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{padding:7px 14px;font-size:13px;font-weight:500;color:var(--gray-600);border:1.5px solid var(--gray-200);border-radius:20px;transition:all .12s}
    .chip:hover{border-color:var(--gray-400)}
    .chip.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);font-weight:600}

    .footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:28px}
    .btn-skip{font-size:14px;color:var(--gray-400)}
    .btn-skip:hover{color:var(--gray-600)}
    .btn-start{padding:12px 28px;font-size:15px;font-weight:700;color:#fff;background:var(--blue);border-radius:10px;letter-spacing:-0.02em;transition:background .15s}
    .btn-start:hover{background:#1b6ef2}
  
    .gnb{position:sticky;top:0;z-index:100;background:#fff}
    .gnb-inner{justify-content:space-between}
    .gnb-right{display:flex;align-items:center;gap:6px}
    .gnb-nav{display:none;gap:22px;font-size:15px;font-weight:500;color:var(--gray-600);margin-right:16px}
    .gnb-nav a:hover{color:var(--ink)}
    .gnb-nav a.on{color:var(--ink);font-weight:700}
    @media(min-width:768px){.gnb-nav{display:flex}}
    .gnb-dropdown{position:static}
    .gnb-dropdown-trigger{display:inline-flex;align-items:center}
    .mega-menu{display:none;position:absolute;left:0;right:0;top:56px;background:#fff;border-bottom:1px solid var(--gray-200);box-shadow:0 8px 24px rgba(0,0,0,.06);z-index:110}
    .mega-menu::before{content:'';position:absolute;top:-24px;left:0;right:0;height:24px}
    .mega-menu.show{display:block}
    .mega-inner{max-width:1100px;margin:0 auto;padding:24px;display:flex;gap:12px;justify-content:center}
    .mega-card{display:flex;align-items:center;gap:14px;padding:16px 20px;border:1px solid var(--gray-200);border-radius:12px;flex:1;max-width:240px;transition:all .15s}
    .mega-card:hover{border-color:var(--blue);box-shadow:0 2px 12px rgba(49,130,246,.08)}
    .mega-card-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
    .mega-card-body{min-width:0}
    .mega-card-title{font-size:14px;font-weight:700;letter-spacing:-0.02em;margin-bottom:2px}
    .mega-card-desc{font-size:12px;color:var(--gray-500)}
    .mega-card-soon{opacity:0.7;cursor:default}
    .mega-card-soon:hover{border-color:var(--gray-200);box-shadow:none;transform:none}
    .mega-card-soon .mega-card-desc{color:var(--gray-400);font-weight:600}
    .gnb-sub{font-size:14px;font-weight:600;color:#fff;background:var(--blue);padding:7px 16px;border-radius:8px;cursor:pointer}
    .gnb-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--gray-600);transition:background .15s}
    .gnb-icon:hover{background:var(--gray-100)}
    .gnb-icon svg{width:20px;height:20px}
</style>
<script>document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.gnb-dropdown').forEach(function(dd){var menu=dd.querySelector('.mega-menu');if(!menu)return;var timer;dd.addEventListener('mouseenter',function(){clearTimeout(timer);menu.classList.add('show');});dd.addEventListener('mouseleave',function(){timer=setTimeout(function(){menu.classList.remove('show');},250);});});});</script></head>
<body>

  <header class="gnb"><div class="gnb-inner"><div style="display:flex;align-items:center;gap:12px"><a href="index.html" class="gnb-logo">Caselab</a><span class="gnb-sub-msg">검증된 AI 큐레이션</span></div><div class="gnb-right"><nav class="gnb-nav"><div class="gnb-dropdown"><a href="trends.html" class="gnb-dropdown-trigger">AI 자료실 <svg width="10" height="6" viewBox="0 0 10 6" fill="none" style="margin-left:2px;vertical-align:middle"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a><div class="mega-menu"><div class="mega-inner"><a href="trends.html" class="mega-card"><div class="mega-card-icon" style="background:linear-gradient(135deg,#f3f4f6,#fafafa);color:var(--gray-800)"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div><div class="mega-card-body"><div class="mega-card-title">AI 트렌드</div><div class="mega-card-desc">요즘 떠오르는 AI 트렌드</div></div></a><a href="tools.html" class="mega-card"><div class="mega-card-icon" style="background:linear-gradient(135deg,#f3f4f6,#fafafa);color:var(--gray-800)"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg></div><div class="mega-card-body"><div class="mega-card-title">쓸만한 AI 도구</div><div class="mega-card-desc">써보고 골라낸 것만</div></div></a><a href="guides.html" class="mega-card"><div class="mega-card-icon" style="background:linear-gradient(135deg,#f3f4f6,#fafafa);color:var(--gray-800)"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div><div class="mega-card-body"><div class="mega-card-title">공식 가이드</div><div class="mega-card-desc">OpenAI·Anthropic 공식 문서</div></div></a><a href="#" class="mega-card mega-card-soon" onclick="return false;"><div class="mega-card-icon" style="background:linear-gradient(135deg,#f3f4f6,#fafafa);color:var(--gray-500)"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg></div><div class="mega-card-body"><div class="mega-card-title">Caselab 도구</div><div class="mega-card-desc">곧 공개합니다</div></div></a></div></div></div><a href="cases.html">AI 실전케이스</a><a href="prompts.html">바로 쓰는 프롬프트</a><a href="ebook-free.html">ebook</a></nav><button class="gnb-sub">구독하기</button><a href="login.html" class="gnb-icon" title="로그인"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a><a href="#" class="gnb-icon" title="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a></div></div></header>


  <div class="wrap">
    <div class="card">
      <h1>가입 완료! 30초만 알려주세요.</h1>
      <p class="sub keepall">선택하면 홈에서 <strong style="color:var(--blue)">내 직무에 맞는 케이스만 먼저</strong> 보여드려요. 나중에 바꿀 수 있습니다.</p>

      <div class="section">
        <div class="section-label">직업</div>
        <div class="job-row">
          <button class="job-btn" type="button" data-group="job">직장인</button>
          <button class="job-btn" type="button" data-group="job">자영업자</button>
          <button class="job-btn" type="button" data-group="job">프리랜서</button>
          <button class="job-btn" type="button" data-group="job">학생</button>
        </div>
      </div>

      <div class="section">
        <div class="section-label">직무</div>
        <div class="job-row">
          <button class="job-btn" type="button" data-group="role">기획</button>
          <button class="job-btn" type="button" data-group="role">마케팅</button>
          <button class="job-btn" type="button" data-group="role">영업</button>
          <button class="job-btn" type="button" data-group="role">디자인</button>
          <button class="job-btn" type="button" data-group="role">개발</button>
          <button class="job-btn" type="button" data-group="role">기타</button>
        </div>
      </div>

      <p class="sub keepall" style="margin-top:18px;margin-bottom:0;font-size:13px;color:var(--gray-400)">관심 주제·도구는 마이페이지에서 천천히 추가할 수 있어요.</p>

      <div class="footer-row">
        <a href="index.html" class="btn-skip" id="skipBtn">건너뛰기</a>
        <button type="button" class="btn-start" id="startBtn">시작하기</button>
      </div>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>

  <script>
    // 직업/직무 단일 선택 토글
    document.querySelectorAll('.job-btn').forEach(function(b){
      b.addEventListener('click',function(){
        var group = this.dataset.group;
        document.querySelectorAll('.job-btn[data-group="'+group+'"]').forEach(function(j){j.classList.remove('on')});
        this.classList.add('on');
      });
    });

    function getSelected(group){
      var el = document.querySelector('.job-btn[data-group="'+group+'"].on');
      return el ? el.textContent.trim() : null;
    }

    // 이미 직무 설정된 사용자는 자동 index로 이동 (소셜 재로그인 등)
    (async function(){
      try {
        var user = await getCurrentUser();
        if (!user) return;
        var profile = await getProfile(user.id);
        if (profile && profile.job) {
          window.location.href = 'index.html';
        }
      } catch(e) {}
    })();

    // 시작하기: profile 업데이트 후 index 이동
    // profiles.job_type / profiles.job 컬럼에 저장 (job은 직무, job_type은 직업군)
    document.getElementById('startBtn').addEventListener('click', async function(){
      var jobType = getSelected('job');   // 직장인/자영업자/프리랜서/학생
      var job = getSelected('role');       // 기획/마케팅/영업/디자인/개발/기타
      try {
        var user = await getCurrentUser();
        if (user) {
          await supabase.from('profiles').update({
            job_type: jobType,
            job: job
          }).eq('id', user.id);
        }
      } catch(e) {}
      window.location.href = 'index.html';
    });
  </script>
<script src="../js/subscribe-modal.js"></script></body>
</html>

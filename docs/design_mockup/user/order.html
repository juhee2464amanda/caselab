<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주문서 — Caselab</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#fff;--bg-sub:#f7f7f7;--ink:#191f28;--gray-800:#333d4b;--gray-600:#6b7684;--gray-500:#8b95a1;--gray-400:#b0b8c1;--gray-300:#d1d6db;--gray-200:#e5e8eb;--gray-100:#f2f4f6;--blue:#3182f6;--blue-bg:#ebf4ff;--red:#f04452}
    *{margin:0;padding:0;box-sizing:border-box}
    html{font-size:16px;-webkit-font-smoothing:antialiased}
    body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg-sub);color:var(--ink);line-height:1.5;letter-spacing:-0.02em;min-height:100vh;display:flex;flex-direction:column}
    .keepall{word-break:keep-all;overflow-wrap:break-word}
    a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:none;background:none}

    .gnb{background:#fff;border-bottom:1px solid var(--gray-200)}
    .gnb-inner{max-width:1100px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px}
    .gnb-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:28px;font-weight:700;letter-spacing:-0.01em}
    .gnb-step{font-size:14px;color:var(--gray-500);display:flex;align-items:center;gap:8px}
    .gnb-step .step{font-weight:600;color:var(--gray-400)}
    .gnb-step .step.on{color:var(--blue)}
    .gnb-step .arrow{color:var(--gray-300)}

    .page{flex:1;max-width:800px;margin:0 auto;padding:32px 24px 80px;width:100%}
    .page-title{font-size:24px;font-weight:800;letter-spacing:-0.03em;margin-bottom:28px}

    /* Order summary */
    .order-card{background:#fff;border:1px solid var(--gray-200);border-radius:14px;padding:24px;margin-bottom:20px}
    .oc-title{font-size:16px;font-weight:800;letter-spacing:-0.02em;margin-bottom:16px}
    .product{display:flex;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--gray-200);margin-bottom:16px}
    .product-cover{width:80px;height:110px;border-radius:6px;overflow:hidden;flex-shrink:0;box-shadow:3px 3px 10px rgba(0,0,0,.12)}
    .product-cover-inner{width:100%;height:100%;background:linear-gradient(135deg,#1a1a1a,#333d4b);display:flex;flex-direction:column;justify-content:flex-end;padding:10px 8px;color:#fff}
    .product-cover-inner .pc-title{font-size:10px;font-weight:800;line-height:1.3}
    .product-cover-inner .pc-sub{font-size:7px;opacity:.5;margin-top:3px}
    .product-info{flex:1}
    .product-name{font-size:16px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px}
    .product-desc{font-size:13px;color:var(--gray-600);margin-bottom:8px}
    .product-format{font-size:12px;color:var(--gray-500);display:flex;gap:8px}
    .product-format span{display:flex;align-items:center;gap:4px}

    .price-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
    .price-row.total{padding-top:12px;border-top:1px solid var(--gray-200);margin-top:4px;font-size:16px;font-weight:800}
    .price-label{color:var(--gray-600)}
    .price-value{font-weight:700}
    .price-original{text-decoration:line-through;color:var(--gray-400);font-weight:400;margin-right:6px}
    .discount{color:var(--red);font-weight:700}

    /* Coupon */
    .coupon-row{display:flex;gap:8px;margin-top:12px}
    .coupon-input{flex:1;padding:10px 14px;font-size:14px;font-family:inherit;border:1px solid var(--gray-200);border-radius:8px;outline:none}
    .coupon-input:focus{border-color:var(--blue)}
    .coupon-input::placeholder{color:var(--gray-400)}
    .coupon-btn{padding:10px 18px;font-size:14px;font-weight:600;color:var(--gray-600);border:1px solid var(--gray-200);border-radius:8px;transition:all .12s}
    .coupon-btn:hover{border-color:var(--gray-400);color:var(--ink)}

    /* Payment method */
    .pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    @media(min-width:640px){.pay-methods{grid-template-columns:1fr 1fr 1fr 1fr}}
    .pay-method{padding:14px;border:1.5px solid var(--gray-200);border-radius:10px;text-align:center;font-size:13px;font-weight:600;color:var(--gray-600);cursor:pointer;transition:all .12s}
    .pay-method:hover{border-color:var(--gray-400)}
    .pay-method.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
    .pay-method .pm-icon{font-size:20px;display:block;margin-bottom:4px}

    /* Buyer info */
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    @media(max-width:640px){.form-row{grid-template-columns:1fr}}
    .form-group{margin-bottom:0}
    .form-label{font-size:13px;font-weight:600;margin-bottom:5px;display:block}
    .form-input{width:100%;padding:10px 14px;font-size:14px;font-family:inherit;border:1px solid var(--gray-200);border-radius:8px;outline:none;color:var(--ink)}
    .form-input:focus{border-color:var(--blue)}
    .form-input::placeholder{color:var(--gray-400)}

    /* Agree */
    .agree-section{margin-top:12px}
    .agree-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;font-size:13px;color:var(--gray-600)}
    .agree-item input{width:18px;height:18px;accent-color:var(--blue);flex-shrink:0;margin-top:1px}
    .agree-item a{color:var(--blue);text-decoration:underline;text-underline-offset:2px}

    /* CTA */
    .order-cta{margin-top:24px}
    .pay-btn{width:100%;padding:16px;font-size:17px;font-weight:800;color:#fff;background:var(--blue);border:none;border-radius:12px;cursor:pointer;transition:background .15s;letter-spacing:-0.02em}
    .pay-btn:hover{background:#1b6ef2}
    .pay-btn:disabled{background:var(--gray-300);cursor:default}
    .pay-notice{text-align:center;font-size:12px;color:var(--gray-400);margin-top:10px}

    /* Toast */
    .toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;border-radius:10px;z-index:999;display:none}
    .toast.show{display:block;animation:toastIn .2s ease}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  </style>
</head>
<body>

  <!-- GNB -->
  <header class="gnb">
    <div class="gnb-inner">
      <a href="index.html" class="gnb-logo">Caselab</a>
      <div class="gnb-step">
        <span class="step">ebook</span>
        <span class="arrow">→</span>
        <span class="step on">주문서</span>
        <span class="arrow">→</span>
        <span class="step">결제</span>
      </div>
    </div>
  </header>

  <div class="toast" id="toast"></div>

  <div class="page">
    <h1 class="page-title">주문서</h1>

    <!-- 상품 정보 -->
    <div class="order-card">
      <div class="oc-title">주문 상품</div>
      <div class="product">
        <div class="product-cover">
          <div class="product-cover-inner">
            <div class="pc-title">AI 프롬프트<br>실전 바이블</div>
            <div class="pc-sub">Caselab</div>
          </div>
        </div>
        <div class="product-info">
          <div class="product-name">AI 프롬프트 실전 바이블</div>
          <div class="product-desc keepall">직무별 검증된 프롬프트 50개 + Before/After 결과물 + 활용 가이드</div>
          <div class="product-format">
            <span>📄 PDF</span>
            <span>📖 뷰어</span>
          </div>
        </div>
      </div>
      <div class="price-row"><span class="price-label">정가</span><span class="price-value"><span class="price-original">29,000원</span></span></div>
      <div class="price-row"><span class="price-label">할인</span><span class="discount">-10,000원 (34%)</span></div>
      <div class="price-row"><span class="price-label">쿠폰</span><span class="price-value" id="couponDiscount">0원</span></div>
      <div class="price-row total"><span>결제 금액</span><span id="totalPrice">19,000원</span></div>
      <div class="coupon-row">
        <input class="coupon-input" type="text" placeholder="쿠폰 코드 입력" id="couponCode" />
        <button class="coupon-btn" type="button" onclick="applyCoupon()">적용</button>
      </div>
    </div>

    <!-- 결제 수단 -->
    <div class="order-card">
      <div class="oc-title">결제 수단</div>
      <div class="pay-methods">
        <div class="pay-method on" onclick="selectPay(this)"><span class="pm-icon">💳</span>카드</div>
        <div class="pay-method" onclick="selectPay(this)"><span class="pm-icon">🏦</span>계좌이체</div>
        <div class="pay-method" onclick="selectPay(this)"><span class="pm-icon">📱</span>카카오페이</div>
        <div class="pay-method" onclick="selectPay(this)"><span class="pm-icon">🍎</span>Apple Pay</div>
      </div>
    </div>

    <!-- 주문자 정보 -->
    <div class="order-card">
      <div class="oc-title">주문자 정보</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">이름</label>
          <input class="form-input" type="text" placeholder="이름" id="buyerName" />
        </div>
        <div class="form-group">
          <label class="form-label">이메일</label>
          <input class="form-input" type="email" placeholder="you@company.com" id="buyerEmail" />
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">연락처 (선택)</label>
        <input class="form-input" type="tel" placeholder="010-0000-0000" />
      </div>
    </div>

    <!-- 동의 -->
    <div class="order-card">
      <div class="agree-section">
        <label class="agree-item">
          <input type="checkbox" id="agreeAll" onchange="toggleAll(this.checked)" />
          <strong>전체 동의</strong>
        </label>
        <label class="agree-item">
          <input type="checkbox" class="agree-check" />
          <span>(필수) <a href="#">이용약관</a>에 동의합니다</span>
        </label>
        <label class="agree-item">
          <input type="checkbox" class="agree-check" />
          <span>(필수) <a href="#">개인정보 수집 및 이용</a>에 동의합니다</span>
        </label>
        <label class="agree-item">
          <input type="checkbox" class="agree-check" />
          <span>(필수) 디지털 콘텐츠 특성상 결제 후 <a href="#">환불이 제한</a>됨에 동의합니다</span>
        </label>
      </div>
    </div>

    <!-- 결제 버튼 -->
    <div class="order-cta">
      <button class="pay-btn" type="button" onclick="processPayment()">19,000원 결제하기</button>
      <div class="pay-notice">결제 완료 후 마이페이지에서 PDF 다운로드 및 뷰어로 읽을 수 있습니다.</div>
    </div>

  </div>

  <script>
    function selectPay(el) {
      document.querySelectorAll('.pay-method').forEach(function(m){m.classList.remove('on')});
      el.classList.add('on');
    }

    function toggleAll(checked) {
      document.querySelectorAll('.agree-check').forEach(function(c){c.checked=checked});
    }

    function applyCoupon() {
      var code = document.getElementById('couponCode').value.trim();
      if (code.toUpperCase() === 'CASELAB') {
        document.getElementById('couponDiscount').textContent = '-5,000원';
        document.getElementById('couponDiscount').style.color = '#f04452';
        document.getElementById('totalPrice').textContent = '14,000원';
        document.querySelector('.pay-btn').textContent = '14,000원 결제하기';
        showToast('쿠폰이 적용되었습니다!');
      } else if (code) {
        showToast('유효하지 않은 쿠폰입니다.');
      }
    }

    function processPayment() {
      var name = document.getElementById('buyerName').value.trim();
      var email = document.getElementById('buyerEmail').value.trim();
      var allChecked = Array.from(document.querySelectorAll('.agree-check')).every(function(c){return c.checked});

      if (!name) return showToast('이름을 입력해 주세요.');
      if (!email) return showToast('이메일을 입력해 주세요.');
      if (!allChecked) return showToast('필수 항목에 모두 동의해 주세요.');

      // TODO: 실제 결제 API 연동 (토스페이먼츠/Stripe)
      showToast('결제 페이지로 이동합니다...');
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show';
      setTimeout(function(){t.className='toast'},3000);
    }
  </script>

</body>
</html>
